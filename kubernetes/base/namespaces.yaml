# Pod Security Admission: restricted everywhere except openmodel-data, which runs
# baseline to leave headroom for future data-tier images (operators, exporters)
# that need more than restricted allows. Postgres and redis as deployed here are
# restricted-compliant. warn/audit stay restricted so any regression is visible.
apiVersion: v1
kind: Namespace
metadata:
  name: openmodel-edge
  labels:
    app.kubernetes.io/part-of: openmodel
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: openmodel-api
  labels:
    app.kubernetes.io/part-of: openmodel
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: openmodel-inference
  labels:
    app.kubernetes.io/part-of: openmodel
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: openmodel-data
  labels:
    app.kubernetes.io/part-of: openmodel
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: openmodel-monitoring
  labels:
    app.kubernetes.io/part-of: openmodel
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted

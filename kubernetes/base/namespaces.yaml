# Pod Security Admission: restricted everywhere except openmodel-data, where the
# postgres image needs baseline (it writes as uid 999 into a mounted PVC and the
# entrypoint chowns PGDATA). warn/audit stay restricted so violations are visible.
apiVersion: v1
kind: Namespace
metadata:
  name: openmodel-edge
  labels:
    app.kubernetes.io/part-of: openmodel
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: openmodel-api
  labels:
    app.kubernetes.io/part-of: openmodel
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: openmodel-inference
  labels:
    app.kubernetes.io/part-of: openmodel
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: openmodel-data
  labels:
    app.kubernetes.io/part-of: openmodel
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: openmodel-monitoring
  labels:
    app.kubernetes.io/part-of: openmodel
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted

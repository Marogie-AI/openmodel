apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces.yaml
  - data/postgres.yaml
  - data/redis.yaml
  - inference/ollama.yaml
  - api/api.yaml
  - edge/gateway.yaml
  - edge/routes.yaml
  - policies/edge.yaml
  - policies/api.yaml
  - policies/inference.yaml
  - policies/data.yaml
  - policies/monitoring.yaml
  - monitoring/servicemonitors.yaml

# Stable ConfigMap names so the StatefulSet volume refs do not need editing.
# Trade-off: no automatic rollout on config change — after editing these files
# run `kubectl -n openmodel-data rollout restart statefulset/postgres`.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  # Files under kubernetes/base/data are copies of api/sql/*, kept in sync by
  # scripts/sync-sql.sh (kustomize cannot read outside its root).
  - name: postgres-config
    namespace: openmodel-data
    files:
      - data/postgresql.conf
  - name: postgres-init
    namespace: openmodel-data
    files:
      - data/01_roles.sh
  - name: api-models
    namespace: openmodel-api
    files:
      - api/models.yaml
  # The Grafana sidecar loads any ConfigMap labelled grafana_dashboard="1", in
  # any namespace. The dashboard JSON lives here rather than under monitoring/
  # because kustomize cannot read files outside its root.
  - name: openmodel-dashboard
    namespace: openmodel-monitoring
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - monitoring/openmodel-dashboard.json

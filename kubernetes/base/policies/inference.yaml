# openmodel-inference: Ollama serves the api. The one egress hole to the
# internet is for pulling models — and it has to be on the *server*, not on the
# ollama-pull Job: `ollama pull` with OLLAMA_HOST set to a URL is only a client
# call, and the Deployment is what downloads the weights. Scoping the hole to
# the Job instead leaves a cold cluster unable to pull anything (the Job's
# /api/pull returns 200 while the server logs a dial timeout to
# registry.ollama.ai). NetworkPolicy has no notion of "only during a pull", so
# this is open at runtime; narrowing it needs an egress proxy or Calico's
# domain-name policy.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: openmodel-inference
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: openmodel-inference
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    # Any pod -> CoreDNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ollama-ingress
  namespace: openmodel-inference
spec:
  # Every inference backend, by role rather than by name: `ollama` and
  # `ollama-coder` today, any future model server without a policy edit.
  podSelector:
    matchLabels:
      app.kubernetes.io/component: inference
  policyTypes: [Ingress]
  ingress:
    - from:
        # api serving pods -> Ollama.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openmodel-api
          podSelector:
            matchLabels:
              app.kubernetes.io/name: api
              app.kubernetes.io/component: api
        # pull Jobs (same namespace) -> Ollama, to drive /api/pull.
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: pull
      ports:
        - port: 11434
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pull-egress
  namespace: openmodel-inference
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: pull
  policyTypes: [Egress]
  egress:
    # Any pull Job -> the inference servers it drives. Each Job only ever dials
    # the one URL in its OLLAMA_HOST; the policy is the coarser of the two.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: inference
      ports:
        - port: 11434
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ollama-registry-egress
  namespace: openmodel-inference
spec:
  # Every inference backend downloads its own weights, so the hole is on the
  # role label rather than on one server's name.
  podSelector:
    matchLabels:
      app.kubernetes.io/component: inference
  policyTypes: [Egress]
  egress:
    # ollama -> registry.ollama.ai over TLS. Everything inside the cluster
    # (pods, Services, nodes) is carved out so this stays an internet-only hole.
    # The three exceptions are, in order: the Calico pod CIDR, the Service
    # CIDR, and this machine's Docker `kind` bridge — the network the node
    # itself sits on. That last one is host-specific:
    #   docker network inspect kind -f '{{range .IPAM.Config}}{{.Subnet}} {{end}}'
    # prints 172.22.0.0/16 here; a machine whose Docker assigned the bridge
    # differently gets 172.18.0.0/16 or similar, and this list must match or
    # the carve-out silently stops covering the node. scripts/cluster-up.sh
    # prints the running value at the end so the drift is visible. On a cloud
    # provider add 169.254.0.0/16 as well: the instance metadata service lives
    # there, and 0.0.0.0/0 otherwise hands every pull pod a credential source.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 192.168.0.0/16
              - 10.96.0.0/16
              - 172.22.0.0/16
      ports:
        - port: 443
          protocol: TCP

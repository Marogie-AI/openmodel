# openmodel-api: default-deny plus the flows the serving pods and the migrate
# Job actually need. The api pod's `wait-for-migrations` initContainer runs
# inside the serving pod, so it is covered by the component=api egress rules.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: openmodel-api
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: openmodel-api
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    # Any pod -> CoreDNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-ingress
  namespace: openmodel-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    # Envoy data plane -> api HTTP. Nothing else may reach the api.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: openmodel
      ports:
        - port: 8000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-ingress
  namespace: openmodel-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    # Prometheus -> /metrics. Same port as the serving traffic, so this is
    # scoped to the Prometheus pods rather than the whole monitoring namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openmodel-monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 8000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-egress
  namespace: openmodel-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/component: api
  policyTypes: [Egress]
  egress:
    # api -> Postgres (app queries + the wait-for-migrations initContainer).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openmodel-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - port: 5432
          protocol: TCP
    # api -> Redis (cache / rate limiting, and the /ready check).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openmodel-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - port: 6379
          protocol: TCP
    # api -> every Ollama inference backend. By role, not by name: the registry
    # routes per model across `ollama` and `ollama-coder`, and /ready probes
    # all of them, so pinning the name here 503s the pod on a new backend.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openmodel-inference
          podSelector:
            matchLabels:
              app.kubernetes.io/component: inference
      ports:
        - port: 11434
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-migrate-egress
  namespace: openmodel-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/component: migrate
  policyTypes: [Egress]
  egress:
    # migrate Job -> Postgres. It needs nothing else (DNS comes from
    # allow-dns-egress, which selects every pod in the namespace).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openmodel-data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - port: 5432
          protocol: TCP

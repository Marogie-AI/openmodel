apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: openmodel-data
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: openmodel
spec:
  # Headless: the governing Service of the StatefulSet. DNS postgres.openmodel-data
  # resolves to the pod IP, which is what the app connects to.
  # Runbook: with a single replica this is unambiguous, but headless DNS
  # round-robins across all ready pods. If replicas ever exceed 1, writes must
  # target the stable per-pod name postgres-0.postgres.openmodel-data.
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
    # Scraped by the `postgres` ServiceMonitor. Headless is fine: the operator
    # builds targets from the Endpoints, not from the (absent) cluster IP.
    - name: metrics
      port: 9187
      targetPort: metrics
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: openmodel-data
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: openmodel
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: openmodel
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18
          args: ["-c", "config_file=/etc/postgresql/postgresql.conf"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: openmodel
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: superuser-password
            - name: OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: owner-password
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: app-password
            - name: MONITOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: monitor-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: config
              mountPath: /etc/postgresql
              readOnly: true
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "openmodel"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "openmodel"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # readOnlyRootFilesystem is off: the entrypoint writes /tmp sockets,
            # /var/run/postgresql and the initdb staging area on the root fs.
            readOnlyRootFilesystem: false
        # Prometheus exporter sidecar. Connects over the pod's loopback as the
        # read-only openmodel_monitor role (pg_monitor), so no network exposure
        # and no write privileges. Note: 01_roles.sh only runs on an empty data
        # dir, so on an already-initialised cluster the role must be created by
        # hand once, as the superuser. The password is the `monitor-password`
        # key of kubernetes/overlays/dev/secrets/postgres.env — read it into a
        # shell variable, never paste it into a command line or a terminal:
        #   CREATE ROLE openmodel_monitor LOGIN PASSWORD '<monitor-password>';
        #   GRANT pg_monitor TO openmodel_monitor;
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
          # No --collector.stat_statements: it emits five series per queryid
          # (420 on an idle cluster) and grows without bound. pg_stat_statements
          # is still loaded by postgresql.conf — query it directly when needed:
          #   select query, calls, total_exec_time from pg_stat_statements
          #   order by total_exec_time desc limit 20;
          ports:
            - name: metrics
              containerPort: 9187
          env:
            - name: DATA_SOURCE_URI
              value: localhost:5432/openmodel?sslmode=disable
            - name: DATA_SOURCE_USER
              value: openmodel_monitor
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: monitor-password
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            # nobody: the exporter is a static binary that needs no home dir.
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: postgres-config
        - name: init
          configMap:
            name: postgres-init
            # 0555: the entrypoint execs *.sh from initdb.d.
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

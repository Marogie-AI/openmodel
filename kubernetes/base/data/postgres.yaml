apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: openmodel-data
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: openmodel
spec:
  # Headless: the governing Service of the StatefulSet. DNS postgres.openmodel-data
  # resolves to the pod IP, which is what the app connects to.
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: openmodel-data
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: openmodel
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: openmodel
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18
          args: ["-c", "config_file=/etc/postgresql/postgresql.conf"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: openmodel
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: superuser-password
            - name: OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: owner-password
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: app-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: config
              mountPath: /etc/postgresql
              readOnly: true
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "openmodel"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "openmodel"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # readOnlyRootFilesystem is off: the entrypoint writes /tmp sockets,
            # /var/run/postgresql and the initdb staging area on the root fs.
            readOnlyRootFilesystem: false
      volumes:
        - name: config
          configMap:
            name: postgres-config
        - name: init
          configMap:
            name: postgres-init
            # 0555: the entrypoint execs *.sh from initdb.d.
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

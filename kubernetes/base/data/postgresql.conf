listen_addresses = '*'
max_connections = 50

shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 64MB
random_page_cost = 1.1

shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on

log_min_duration_statement = 250ms
log_lock_waits = on
log_temp_files = 0
log_checkpoints = on
log_line_prefix = '%m [%p] %q%u@%d app=%a '

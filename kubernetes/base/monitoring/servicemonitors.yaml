# Scrape targets. The kube-prometheus-stack release runs with
# {service,pod}MonitorSelectorNilUsesHelmValues=false, so these objects need no
# release label and may live in the namespace of the workload they select.
# kubelet/cAdvisor and kube-state-metrics come from the chart itself.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api
  namespace: openmodel-api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: openmodel
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  endpoints:
    # Two api replicas → two targets; the Service's `http` port is 8000.
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres
  namespace: openmodel-data
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: openmodel
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  endpoints:
    # The postgres-exporter sidecar. 30s: database gauges move slowly and each
    # scrape costs a handful of queries against pg_stat_*.
    - port: metrics
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy
  # In the Envoy Gateway namespace: the proxy pods are created by the
  # controller from the Gateway, so there is nothing of ours to label there.
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: envoy
    app.kubernetes.io/part-of: openmodel
spec:
  selector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: openmodel
  podMetricsEndpoints:
    # The proxy pod declares 19001 as a named container port, so no portNumber.
    - port: metrics
      path: /stats/prometheus
      interval: 15s

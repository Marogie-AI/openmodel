apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Stable Secret names: workloads reference them by name in secretKeyRef/envFrom.
generatorOptions:
  disableNameSuffixHash: true

# secrets/*.env is git-ignored; run scripts/secrets.sh to create it.
secretGenerator:
  - name: postgres-credentials
    namespace: openmodel-data
    envs:
      - secrets/postgres.env
  - name: api-secrets
    namespace: openmodel-api
    envs:
      - secrets/api.env
  # The owner DSN is split out so only the migrate Job and its initContainer
  # mount it; the serving container never sees a DDL-capable role.
  - name: api-migrate-secrets
    namespace: openmodel-api
    envs:
      - secrets/api-migrate.env
  # Grafana reads this via `grafana.admin.existingSecret`. cluster-up.sh also
  # creates it directly from the same file, because helm needs it to exist
  # before the Grafana pod starts — which is earlier than `deploy.sh` runs.
  - name: grafana-admin
    namespace: openmodel-monitoring
    envs:
      - secrets/grafana.env

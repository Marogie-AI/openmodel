# GHCR is private, so both pod specs that run the image need a pull secret.
# The `ghcr` Secret itself is created by the CI workflow in phase 5, not here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: openmodel-api
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr
---
apiVersion: batch/v1
kind: Job
metadata:
  name: api-migrate
  namespace: openmodel-api
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull qwen2.5:0.5b && ollama pull nomic-embed-text"]
    restart: "no"

  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: openmodel
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      - "${OPENMODEL_PG_HOST_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql
      # Single source, shared with the cluster: kustomize cannot read files
      # outside its own root, but compose can read anywhere, so compose follows.
      - ./kubernetes/base/data/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./kubernetes/base/data/01_roles.sh:/docker-entrypoint-initdb.d/01_roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openmodel"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      OPENMODEL_DATABASE_OWNER_URL: postgresql+asyncpg://openmodel_owner:owner@postgres:5432/openmodel
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "${OPENMODEL_HOST_PORT:-8000}:8000"
    environment:
      OPENMODEL_MODELS_FILE: /app/models.compose.yaml
      OPENMODEL_DATABASE_URL: postgresql+asyncpg://openmodel_app:app@postgres:5432/openmodel
      OPENMODEL_DATABASE_OWNER_URL: postgresql+asyncpg://openmodel_owner:owner@postgres:5432/openmodel
      OPENMODEL_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./apps/backend/models.compose.yaml:/app/models.compose.yaml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  ollama:
  postgres:
